<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carmarket Place - ศูนย์รวมซื้อขายรถยนต์ยุคใหม่</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header Navigation -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="car" class="w-8 h-8 text-blue-500"></i>
                <span class="font-bold text-xl tracking-tight text-white">Carmarket <span class="text-blue-500">Place</span></span>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleAdminModal()" class="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                    <i data-lucide="shield-alert" class="w-4 h-4 text-amber-400"></i>
                    <span>Admin Leads</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Car Listings Section -->
        <section class="lg:col-span-2 space-y-6">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="sparkles" class="text-blue-400"></i> รถยนต์คัดเกรดแนะนำ
                </h1>
                <span class="text-xs bg-blue-500/10 text-blue-400 px-2.5 py-1 rounded-full border border-blue-500/20">พร้อมบริการไฟแนนซ์</span>
            </div>

            <!-- Car Cards List -->
            <div id="carList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <!-- Sidebar: Pre-Approval Loan Simulator -->
        <aside class="space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i data-lucide="calculator" class="text-emerald-400"></i> ประเมินวงเงิน & ขอสินเชื่อ
                </h2>

                <form id="loanForm" onsubmit="handleLoanSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">รุ่นรถที่สนใจ</label>
                        <select id="loanCarSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
                            <option value="Toyota Camry 2.5 HV">Toyota Camry 2.5 HV (890,000 THB)</option>
                            <option value="Honda Civic 1.5 RS">Honda Civic 1.5 RS (750,000 THB)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1">ชื่อ-นามสกุล ผู้ขอสินเชื่อ</label>
                        <input type="text" id="custName" required placeholder="สมชาย ใจดี" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1">เบอร์โทรศัพท์ติดต่อ</label>
                        <input type="tel" id="custPhone" required placeholder="0812345678" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1">รายได้ต่อเดือน (บาท)</label>
                        <input type="number" id="custIncome" required placeholder="35000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
                    </div>

                    <div class="flex items-start gap-2 pt-2">
                        <input type="checkbox" id="pdpaConsent" required class="mt-1">
                        <label for="pdpaConsent" class="text-xs text-slate-400 leading-relaxed">
                            ยินยอมให้จัดเก็บและเปิดเผยข้อมูลส่วนบุคคลตามนโยบาย PDPA
                        </label>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition text-sm">
                        ส่งข้อมูลยื่นขออนุมัติ
                    </button>
                </form>
            </div>
        </aside>
    </main>

    <!-- Admin Leads Modal -->
    <div id="adminModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-3xl w-full p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-4">
                <h3 class="font-bold text-lg text-white">รายการผู้ขอสินเชื่อ (Finance Leads)</h3>
                <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
            </div>
            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-900 text-slate-400 uppercase">
                        <tr>
                            <th class="p-3">วันที่</th>
                            <th class="p-3">ชื่อลูกค้า</th>
                            <th class="p-3">เบอร์โทร</th>
                            <th class="p-3">รุ่นรถ</th>
                            <th class="p-3">สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody" class="divide-y divide-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const cars = [
            { id: 1, name: "Toyota Camry 2.5 HV", price: 890000, year: 2021, img: "https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=600&auto=format&fit=crop&q=60" },
            { id: 2, name: "Honda Civic 1.5 RS", price: 750000, year: 2022, img: "https://images.unsplash.com/photo-1606152421802-db97b9c7a11b?w=600&auto=format&fit=crop&q=60" }
        ];
        let financeLeads = JSON.parse(localStorage.getItem('carmarket_leads') || '[]');

        function renderCars() {
            document.getElementById('carList').innerHTML = cars.map(car => `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden">
                    <img src="${car.img}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="font-bold text-white">${car.name}</h3>
                        <p class="text-blue-400 font-bold text-sm">${car.price.toLocaleString()} THB</p>
                    </div>
                </div>
            `).join('');
        }

        function handleLoanSubmit(e) {
            e.preventDefault();
            financeLeads.unshift({
                date: new Date().toLocaleDateString('th-TH'),
                car: document.getElementById('loanCarSelect').value,
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                status: 'รอส่งธนาคาร'
            });
            localStorage.setItem('carmarket_leads', JSON.stringify(financeLeads));
            alert('ส่งข้อมูลสำเร็จ!');
            document.getElementById('loanForm').reset();
            renderLeads();
        }

        function toggleAdminModal() {
            document.getElementById('adminModal').classList.toggle('hidden');
            renderLeads();
        }

        function renderLeads() {
            document.getElementById('leadsTableBody').innerHTML = financeLeads.map(l => `
                <tr>
                    <td class="p-3">${l.date}</td>
                    <td class="p-3">${l.name}</td>
                    <td class="p-3">${l.phone}</td>
                    <td class="p-3">${l.car}</td>
                    <td class="p-3">${l.status}</td>
                </tr>
            `).join('');
        }
        renderCars();
    </script>
</body>
</html>
